<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050b14" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.65" />
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" opacity="0.3" />
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.6; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes dashStream {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(420px); opacity: 0; }
      }

      .animated-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseOrb 8s ease-in-out infinite;
      }
      .animated-orb-2 {
        transform-origin: 1000px 300px;
        animation: pulseOrb 10s ease-in-out infinite reverse;
      }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: dashStream 6s linear infinite;
      }
      .floating-card-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatFast 4.2s ease-in-out infinite 0.5s;
      }
      .floating-card-3 {
        animation: floatSlow 6s ease-in-out infinite 1s;
      }
      .tech-pill {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- 2. Ambient Dynamic Glowing Orbs (Deep Background) -->
  <circle class="animated-orb-1" cx="220" cy="90" r="140" fill="url(#accentGlow)" filter="url(#glow)" />
  <circle class="animated-orb-2" cx="1020" cy="310" r="160" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="animated-orb-1" cx="950" cy="80" r="100" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- 3. Dynamic Animated Data Streams (Midground - Behind Foreground Text) -->
  <g opacity="0.35">
    <path class="stream-line" d="M -50 80 Q 300 160 600 70 T 1250 100" fill="none" stroke="#0284c7" stroke-width="2" />
    <path class="stream-line" d="M -50 340 Q 400 240 800 350 T 1250 280" fill="none" stroke="#6366f1" stroke-width="1.8" />
    <path class="stream-line" d="M 150 -30 Q 350 220 500 450" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="stream-line" d="M 850 -30 Q 750 220 1050 450" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- 4. Dynamic Decorative Metric Badges/Cards (Lateral Flanks - Non-obstructive) -->
  <!-- Left Side Floating Card -->
  <g class="floating-card-1" transform="translate(60, 110)">
    <rect width="150" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="26" cy="28" r="8" fill="#10b981" />
    <text x="42" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">METERING</text>
    <text x="22" y="58" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Real-Time</text>
  </g>

  <g class="floating-card-2" transform="translate(45, 230)">
    <rect width="165" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="26" cy="28" r="8" fill="#38bdf8" />
    <text x="42" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">TENANT RBAC</text>
    <text x="22" y="58" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Multi-Tenant</text>
  </g>

  <!-- Right Side Floating Card -->
  <g class="floating-card-3" transform="translate(980, 110)">
    <rect width="160" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="26" cy="28" r="8" fill="#a855f7" />
    <text x="42" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">GOVERNANCE</text>
    <text x="22" y="58" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Audit-Ready</text>
  </g>

  <g class="floating-card-1" transform="translate(995, 230)">
    <rect width="150" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="26" cy="28" r="8" fill="#f59e0b" />
    <text x="42" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">MSP REVENUE</text>
    <text x="22" y="58" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Automated</text>
  </g>

  <!-- 5. Foreground Content Layer: Title, Subtitle, & Taglines (Always in Sharp Foreground) -->
  <g id="foreground-content">
    <!-- Category Super-Title Pill -->
    <g transform="translate(460, 48)">
      <rect width="280" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="18" fill="#bae6fd" class="tech-pill">CLOUD BACKUP &amp; DATA RESILIENCE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#primaryTextGrad)" letter-spacing="-0.5px">
      Cloud Backup Account &amp; License Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#cbd5e1" letter-spacing="0.2px">
      Curated Ecosystem for Multi-Tenant Governance, Consumption Tracking &amp; Automated Billing
    </text>

    <!-- Detailed Secondary Subtitle -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Enterprise SaaS Platforms • Open-Source Metering Engines • MSP Entitlement Tooling
    </text>

    <!-- Feature Pills in Center Foreground -->
    <g transform="translate(290, 275)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" rx="17" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
        <text x="67" y="21" text-anchor="middle" fill="#38bdf8" class="tech-pill">⚡ Multi-Tenant</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(155, 0)">
        <rect width="145" height="34" rx="17" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
        <text x="72" y="21" text-anchor="middle" fill="#a5b4fc" class="tech-pill">📊 Usage Metering</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(320, 0)">
        <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="70" y="21" text-anchor="middle" fill="#c4b5fd" class="tech-pill">🔑 License Keys</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(480, 0)">
        <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
        <text x="70" y="21" text-anchor="middle" fill="#6ee7b7" class="tech-pill">💰 Auto-Billing</text>
      </g>
    </g>

    <!-- Border Accent Line at Bottom -->
    <line x1="300" y1="365" x2="900" y2="365" stroke="#334155" stroke-width="1" />
    <circle cx="600" cy="365" r="4" fill="#38bdf8" />
  </g>
</svg>
